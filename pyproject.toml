[project]
name = "usurpad"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Miela Marshall" }
]
requires-python = ">=3.14"
dependencies = [
    "minikerberos>=0.4.12",
    "msldap>=0.5.15",
]

[project.scripts]
usurpad = "usurpad:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
[tool.uv.sources]
msldap = { git = "https://github.com/skelsec/msldap" }
